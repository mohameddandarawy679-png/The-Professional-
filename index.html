<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة المليون دولار - المحترف 😎</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui;color:#fff;min-height:100vh;
  /* الخلفية الثابتة من cover.jpg */
  background: #0f172a url('cover.jpg') center/cover no-repeat fixed;
}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:-1}
header{position:sticky;top:0;background:rgba(15,23,42,.95);padding:12px;display:flex;gap:8px;align-items:center;z-index:10}
.logo{width:46px;height:46px;border-radius:13px;overflow:hidden;flex-shrink:0;border:2px solid #f59e0b;background:#fff}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:17px;margin:0;line-height:1.4} h1 span{color:#f59e0b}
.card{max-width:420px;margin:22px auto;background:#fff;color:#111;padding:22px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card .icon{width:84px;height:84px;border-radius:22px;margin:0 auto;overflow:hidden;border:3px solid #f59e0b}
.card .icon img{width:100%;height:100%;object-fit:cover}
input{width:100%;padding:14px;border:2px solid #ddd;border-radius:14px;margin:10px 0;font-size:16px;text-align:center}
.btn{background:#f59e0b;border:0;padding:14px;width:100%;border-radius:99px;font-weight:900;cursor:pointer;font-size:16px}
.btn2{background:#111;color:#fff;border:0;padding:8px 14px;border-radius:99px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1000px;margin:12px auto;padding:0 12px}
.lesson{background:#fff;color:#111;border-radius:18px;padding:14px;cursor:pointer}
.tag{display:inline-block;background:#fef3c7;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}
details{margin-top:10px;background:#f8fafc;padding:10px;border-radius:12px}
.qa{background:#fff7ed;padding:8px;border-radius:10px;margin:6px 0}
.hidden{display:none}
.progress{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#22c55e;width:0%}

<!-- ===== صفحة الدخول - اتصلحت ===== -->
<div id="loginPage">
<div class="card" style="text-align:center">
<!-- الايقونة الثابتة author.jpg -->
<div class="icon"><img src="author.jpg" alt="logo"></div>
<h2 style="line-height:1.5;margin:12px 0 4px">رحلة المليون دولار<br><span style="color:#f59e0b;font-size:18px">المحترف 😎</span></h2>
<p style="font-size:14px;color:#475569;line-height:1.7;margin:0">200 درس<br>لغات + برمجة + صناعة + تصميم<br><b>من صفر لمحترف</b></p>

<div style="position:relative">
<input id="pass" type="password" placeholder="اكتب كلمة المرور هنا...">
<span onclick="let p=document.getElementById('pass');p.type=p.type==='password'?'text':'password'" style="position:absolute;left:14px;top:22px;cursor:pointer">👁️</span>
</div>

<button class="btn" onclick="login()">دخول 🚀</button>
<p id="msg" style="color:red;font-weight:800"></p>
<!-- شيلنا كلمة التجربة وشيلنا زرار الخلفية والايقونة من هنا -->
<p style="font-size:12px;color:#94a3b8">كل كلمة بتشتغل مرة واحدة بس وبعدها بتتحرق 🔥</p>
</div>
</div>

<!-- ===== جوه الموقع ===== -->
<div id="homePage" class="hidden">

<div class="logo"><img src="author.jpg"></div>
<div><h1>رحلة المليون دولار <span>المحترف</span></h1><small id="progText">0 / 200 درس</small></div>
<button class="btn2" onclick="logout()" style="margin-inline-start:auto">خروج</button>
</header>
<div style="max-width:1000px;margin:10px auto;padding:0 12px">
<div class="progress"><div id="progBar"></div></div>
<div style="display:flex;gap:8px;margin:10px 0"><input id="search" oninput="render()" placeholder="🔍 دور على درس..." style="flex:1"><select id="filter" onchange="render()" style="padding:12px;border-radius:12px"><option value="">كل المراحل</option><option>التأسيس</option><option>HTML + CSS</option><option>JavaScript</option><option>Python</option><option>تصميم UI/UX</option><option>صناعة Maker</option><option>تطبيقات + AI</option><option>الاحتراف والشغل</option></select></div>

const ALL_CODES = Array.from({length:50},(_,i)=>`TAREEQ-${String(i+1).padStart(3,'0')}-2026`);
let used = JSON.parse(localStorage.getItem('tareeq_used')||'[]');
let done = JSON.parse(localStorage.getItem('tareeq_done')||'[]');
if(localStorage.getItem('tareeq_login')==='yes'){showHome();}
function login(){
  let v=document.getElementById('pass').value.trim().toUpperCase();
  if(used.includes(v)){document.getElementById('msg').textContent='الكلمة دي اتحرقت خلاص 🔥';return;}
  if(!ALL_CODES.includes(v)){document.getElementById('msg').textContent='كلمة غلط، اطلب كلمة جديدة';return;}
  used.push(v); localStorage.setItem('tareeq_used',JSON.stringify(used));
  localStorage.setItem('tareeq_login','yes'); showHome();
}
function logout(){localStorage.removeItem('tareeq_login');location.reload();}
function showHome(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('homePage').classList.remove('hidden');render();}
function toggleDone(id,btn){if(done.includes(id)){done=done.filter(x=>x!==id);btn.textContent='خلصت الدرس ✅';btn.style.background='#111';}else{done.push(id);btn.textContent='تم ✅ +10 نقط';btn.style.background='#22c55e';}localStorage.setItem('tareeq_done',JSON.stringify(done));updateProg();}

function updateProg(){let p=Math.round(done.length/200*100);document.getElementById('progBar').style.width=p+'%';document.getElementById('progText').textContent=done.length+' / 200 درس - '+p+'%';}
function render(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  let f=document.getElementById('filter').value;
  let html='';
  TITLES.forEach(t=>{let [id,stage,title]=t; if(f && stage!==f) return; if(q && !title.includes(q) && !String(id).includes(q)) return;
  let isDone=done.includes(id);
  html+=`<div class="lesson"><span class="tag">${stage}</span><br><b>درس ${id}: ${title}</b><details><summary>افتح الشرح والاسئلة 👇</summary><p><b>الشرح:</b> في الدرس ده هتتعلم <b>${title}</b> من الصفر، هنبدأ بفكرة بسيطة وبعدين نطبق مشروع صغير.</p><div class="qa"><b>س1:</b> ايه فكرة ${title}؟ <button class="btn2" onclick="this.nextElementSibling.classList.toggle('hidden')">الاجابة</button><span class="hidden"> 👈 الفكرة هي ${title} وهتستخدمها في مشروعك.</span></div><div class="qa"><b>س2:</b> فين هتستخدمها؟ <button class="btn2" onclick="this.nextElementSibling.classList.toggle('hidden')">الاجابة</button><span class="hidden"> 👈 في كل مشروع حقيقي.</span></div><div class="qa"><b>س3:</b> ايه التحدي؟ <button class="btn2" onclick="this.nextElementSibling.classList.toggle('hidden')">الاجابة</button><span class="hidden"> 👈 اعمل مشروع صغير وابعته.</span></div><button class="btn" onclick="toggleDone(${id},this)" style="margin-top:8px;background:${isDone?'#22c55e':'#111'}">${isDone?'تم ✅ +10 نقط':'خلصت الدرس ✅'}</button></details></div>`;});
  document.getElementById('list').innerHTML=html; updateProg();
}
render();
