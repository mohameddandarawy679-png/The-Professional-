let savedBG = localStorage.getItem('tareeq_bg'); if(savedBG) document.body.style.backgroundImage=`url(${savedBG})`;
let savedIcon = localStorage.getItem('tareeq_icon'); if(savedIcon){document.getElementById('loginIcon').innerHTML=`<img src="${savedIcon}">`;document.getElementById('headIcon').innerHTML=`<img src="${savedIcon}">`;}
if(localStorage.getItem('tareeq_login')==='yes'){showHome();}

function login(){
  let v=document.getElementById('pass').value.trim().toUpperCase();
  if(used.includes(v)){document.getElementById('msg').textContent='الكلمة دي اتحرقت خلاص 🔥';return;}
  if(!ALL_CODES.includes(v)){document.getElementById('msg').textContent='كلمة غلط، جرب TAREEQ-001-2026';return;}
  used.push(v); localStorage.setItem('tareeq_used',JSON.stringify(used));
  localStorage.setItem('tareeq_login','yes'); showHome();
}
function logout(){localStorage.removeItem('tareeq_login');location.reload();}
function showHome(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('homePage').classList.remove('hidden');render();}
function setBG(el){let r=new FileReader();r.onload=e=>{document.body.style.backgroundImage=`url(${e.target.result})`;localStorage.setItem('tareeq_bg',e.target.result)};r.readAsDataURL(el.files[0]);}
function setIcon(el){let r=new FileReader();r.onload=e=>{localStorage.setItem('tareeq_icon',e.target.result);document.getElementById('loginIcon').innerHTML=`<img src="${e.target.result}">`;document.getElementById('headIcon').innerHTML=`<img src="${e.target.result}">`};r.readAsDataURL(el.files[0]);}
function toggleDone(id,btn){if(done.includes(id)){done=done.filter(x=>x!==id);btn.textContent='خلصت الدرس ✅';btn.style.background='#111';}else{done.push(id);btn.textContent='تم ✅ +10 نقط';btn.style.background='#22c55e';}localStorage.setItem('tareeq_done',JSON.stringify(done));updateProg();}

function render(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  let f=document.getElementById('filter').value;
  let html='';
  TITLES.forEach(t=>{
    let [id,stage,title]=t;
    if(f && stage!==f) return;
    if(q && !title.includes(q) && !String(id).includes(q)) return;
    let isDone=done.includes(id);
    html+=`<div class="lesson"><span class="tag">${stage}</span> <span style="float:left">${isDone?'✅':''}</span><br><b>درس ${id}: ${title}</b><details><summary>افتح الشرح والاسئلة 👇</summary>

    <p><b>جرب بنفسك:</b> افتح محرر الاكواد واكتب اول مثال للدرس ده، وغلط عادي، الغلط هو اللي بيعلم.</p>
    <div class="qa"><b>س1:</b> ايه فكرة درس ${title}؟ <br><button class="btn2" onclick="this.nextElementSibling.classList.toggle('hidden')">اظهر الاجابة</button><span class="hidden"> 👈 الفكرة هي ${title}، وهتستخدمها في مشروعك الجاي.</span></div>
    <div class="qa"><b>س2:</b> فين هتستخدم ${title} في الحياة؟ <br><button class="btn2" onclick="this.nextElementSibling.classList.toggle('hidden')">اظهر الاجابة</button><span class="hidden"> 👈 في كل مشروع حقيقي، من موقع لموبايل لروبوت.</span></div>
    <div class="qa"><b>س3:</b> ايه التحدي بتاع الدرس ده؟ <br><button class="btn2" onclick="this.nextElementSibling.classList.toggle('hidden')">اظهر الاجابة</button><span class="hidden"> 👈 اعمل مشروع صغير باللي اتعلمته وابعته.</span></div>
